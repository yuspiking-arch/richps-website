<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rich PS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #e0e4ec;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 2px solid #2a313c;
            margin-bottom: 30px;
        }

        .panel-header h1 {
            font-size: 1.8rem;
            color: #ff6b35;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header h1 i {
            font-size: 1.5rem;
        }

        .panel-header .badge {
            background: #2a313c;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            color: #8892a8;
            border: 1px solid #4a5568;
        }

        .panel-header .badge i {
            color: #00b894;
            margin-right: 5px;
        }

        .section-card {
            background: linear-gradient(145deg, #1a1f2a, #131820);
            border-radius: 20px;
            border: 1px solid #2a313c;
            padding: 25px 30px;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .section-card:hover {
            border-color: #ff6b35;
        }

        .section-card .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-card .section-title i {
            color: #ff6b35;
        }

        .section-card .section-title .count {
            font-size: 0.7rem;
            color: #6a7488;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #aab3c5;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2a313c;
            background: #0b0e14;
            color: #e0e4ec;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-group .hint {
            font-size: 0.7rem;
            color: #6a7488;
            margin-top: 4px;
        }

        .form-group .hint span {
            color: #ff6b35;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            color: #fff;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
        }

        .btn-submit i {
            margin-right: 8px;
        }

        .btn-danger {
            background: none;
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 4px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background: #ff4757;
            color: #fff;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #2a313c;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .list-item:hover {
            border-color: #ff6b35;
        }

        .list-item .info {
            flex: 1;
        }

        .list-item .info .title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .list-item .info .desc {
            font-size: 0.8rem;
            color: #8892a8;
        }

        .list-item .info .meta {
            font-size: 0.7rem;
            color: #6a7488;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .list-item .actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #6a7488;
        }

        .empty-state i {
            font-size: 2rem;
            color: #2a313c;
            margin-bottom: 10px;
            display: block;
        }

        /* ===== PASSWORD OVERLAY ===== */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 50% 50%, rgba(255, 107, 53, 0.1) 0%, transparent 70%),
                linear-gradient(135deg, #0b0e14 0%, #1a1f2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            backdrop-filter: blur(8px);
        }

        .password-overlay.hidden {
            display: none;
        }

        .password-box {
            background: linear-gradient(145deg, #1a1f2a, #131820);
            border: 1px solid #2a313c;
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .password-box .lock-icon {
            font-size: 3rem;
            color: #ff6b35;
            margin-bottom: 15px;
        }

        .password-box h2 {
            color: #f0f4fa;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .password-box p {
            color: #8892a8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .password-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a313c;
            background: #0b0e14;
            color: #e0e4ec;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.3s;
        }

        .password-box input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .password-box .error-msg {
            color: #ff4757;
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 20px;
        }

        .password-box .btn-unlock {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .password-box .btn-unlock:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.4);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #1a1f2a, #0b0e14);
            color: #e0e4ec;
            padding: 14px 22px;
            border-radius: 12px;
            border: 1px solid #2a313c;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 9999;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success i {
            color: #00b894;
        }
        .toast.error i {
            color: #ff4757;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .panel-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .section-card {
                padding: 18px 16px;
            }
            .list-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .list-item .actions {
                width: 100%;
                justify-content: flex-start;
            }
            .password-box {
                padding: 30px 20px;
                margin: 0 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }
            .panel-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== PASSWORD OVERLAY ===== -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <div class="lock-icon"><i class="fas fa-lock"></i></div>
            <h2>Admin Panel</h2>
            <p>Enter password to access the dashboard</p>
            <input type="password" id="passwordInput" placeholder="••••••••" maxlength="20">
            <div class="error-msg" id="passwordError"></div>
            <button class="btn-unlock" id="unlockBtn">
                <i class="fas fa-unlock-alt"></i> Unlock
            </button>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container" id="mainContent" style="display:none;">
        <!-- HEADER -->
        <div class="panel-header">
            <h1>
                <i class="fas fa-crown"></i>
                Admin Panel
                <span style="font-size:0.6rem; font-weight:400; color:#6a7488; margin-left:8px;">Rich PS</span>
            </h1>
            <div>
                <span class="badge"><i class="fas fa-circle"></i> Connected</span>
                <span class="badge" style="margin-left:8px;">
                    <i class="fas fa-sync-alt fa-fw"></i> Auto-save
                </span>
            </div>
        </div>

        <!-- SECTION: UPDATE LOG -->
        <div class="section-card">
            <div class="section-title">
                <i class="fas fa-history"></i>
                Update Log
                <span class="count">(<span id="updateCount">0</span>)</span>
            </div>

            <form id="updateForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="updateDate">📅 Date</label>
                        <input type="date" id="updateDate" required>
                    </div>
                    <div class="form-group">
                        <label for="updateTitle">📌 Title</label>
                        <input type="text" id="updateTitle" placeholder="e.g. Patch 25/07/2026" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="updateChanges">📝 Changes (one per line)</label>
                    <textarea id="updateChanges" placeholder="[+] ADD /BANKGEMS&#10;[+] ADD CITEM Tricky&#10;[-] FIXED Auto Surgeon Station &amp; Vile Vial" required></textarea>
                    <div class="hint">
                        <span>[+]</span> ADD &nbsp;|&nbsp; <span>[-]</span> FIXED &nbsp;|&nbsp; <span>[x]</span> REMOVED &nbsp;|&nbsp; <span>[~]</span> CHANGED
                    </div>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-plus"></i> Add Update</button>
            </form>

            <hr style="border-color:#2a313c; margin:20px 0;">

            <div id="updateList">
                <!-- Updates akan di-render di sini -->
            </div>
        </div>

        <!-- SECTION: TUTORIAL -->
        <div class="section-card">
            <div class="section-title">
                <i class="fas fa-video"></i>
                Video Tutorial
                <span class="count">(<span id="tutorialCount">0</span>)</span>
            </div>

            <form id="tutorialForm">
                <div class="form-group">
                    <label for="tutorialTitle">📌 Title</label>
                    <input type="text" id="tutorialTitle" placeholder="e.g. TUTORIAL AUTO PTHT" required>
                </div>
                <div class="form-group">
                    <label for="tutorialDesc">📝 Description</label>
                    <input type="text" id="tutorialDesc" placeholder="Short description of the tutorial" required>
                </div>
                <div class="form-group">
                    <label for="tutorialUrl">🔗 TikTok URL</label>
                    <input type="url" id="tutorialUrl" placeholder="https://vt.tiktok.com/..." required>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-plus"></i> Add Tutorial</button>
            </form>

            <hr style="border-color:#2a313c; margin:20px 0;">

            <div id="tutorialList">
                <!-- Tutorial akan di-render di sini -->
            </div>
        </div>

        <!-- FOOTER -->
        <div style="text-align:center; padding:20px 0; color:#6a7488; font-size:0.8rem; border-top:1px solid #1a1f2a;">
            <i class="fas fa-database" style="color:#ff6b35;"></i> Data stored in <strong>localStorage</strong> &bull; 
            Changes appear instantly on the public website
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script>
        // =============================================
        // ===== PASSWORD PROTECTION =====
        // =============================================
        // GANTI PASSWORD DI SINI
        const ADMIN_PASSWORD = 'admin123';

        const passwordOverlay = document.getElementById('passwordOverlay');
        const mainContent = document.getElementById('mainContent');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const passwordError = document.getElementById('passwordError');

        function checkPassword() {
            const input = passwordInput.value.trim();
            if (input === ADMIN_PASSWORD) {
                passwordOverlay.classList.add('hidden');
                mainContent.style.display = 'block';
                passwordError.textContent = '';
                passwordInput.value = '';
                showToast('🔓 Welcome Admin!', 'success');
                // Focus ke form pertama
                document.getElementById('updateTitle').focus();
            } else {
                passwordError.textContent = '❌ Wrong password. Please try again.';
                passwordInput.value = '';
                passwordInput.focus();
                passwordInput.style.borderColor = '#ff4757';
                setTimeout(() => {
                    passwordInput.style.borderColor = '#2a313c';
                }, 1000);
            }
        }

        unlockBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // Focus otomatis ke input password
        setTimeout(() => passwordInput.focus(), 300);

        // =============================================
        // ===== TOAST =====
        // =============================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const icon = toast.querySelector('i');

            toastMessage.textContent = message;
            toast.className = 'toast ' + type;
            icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';

            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // =============================================
        // ===== DATA MANAGEMENT =====
        // =============================================
        function getUpdates() {
            return JSON.parse(localStorage.getItem('richps-updates')) || [];
        }

        function setUpdates(updates) {
            localStorage.setItem('richps-updates', JSON.stringify(updates));
        }

        function getTutorials() {
            return JSON.parse(localStorage.getItem('richps-tutorials')) || [];
        }

        function setTutorials(tutorials) {
            localStorage.setItem('richps-tutorials', JSON.stringify(tutorials));
        }

        // =============================================
        // ===== RENDER UPDATES =====
        // =============================================
        function renderUpdates() {
            const updates = getUpdates();
            const list = document.getElementById('updateList');
            const count = document.getElementById('updateCount');
            count.textContent = updates.length;

            if (updates.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No updates yet. Add one above!</p></div>`;
                return;
            }

            list.innerHTML = updates.map((u, index) => `
                <div class="list-item">
                    <div class="info">
                        <div class="title">${u.title}</div>
                        <div class="meta">
                            <span><i class="far fa-calendar-alt"></i> ${u.date}</span>
                            <span>${u.changes.length} changes</span>
                        </div>
                        <div class="desc" style="margin-top:4px; font-size:0.8rem; color:#8892a8;">
                            ${u.changes.map(c => `[${c.type}] ${c.text}`).join(' • ')}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-danger" onclick="deleteUpdate(${index})">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function deleteUpdate(index) {
            if (!confirm('Delete this update?')) return;
            const updates = getUpdates();
            updates.splice(index, 1);
            setUpdates(updates);
            renderUpdates();
            showToast('Update deleted!', 'success');
        }

        // =============================================
        // ===== RENDER TUTORIALS =====
        // =============================================
        function renderTutorials() {
            const tutorials = getTutorials();
            const list = document.getElementById('tutorialList');
            const count = document.getElementById('tutorialCount');
            count.textContent = tutorials.length;

            if (tutorials.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-video"></i><p>No tutorials yet. Add one above!</p></div>`;
                return;
            }

            list.innerHTML = tutorials.map((t, index) => `
                <div class="list-item">
                    <div class="info">
                        <div class="title">${t.title}</div>
                        <div class="desc">${t.desc}</div>
                        <div class="meta">
                            <span><i class="fab fa-tiktok"></i> ${t.url}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-danger" onclick="deleteTutorial(${index})">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function deleteTutorial(index) {
            if (!confirm('Delete this tutorial?')) return;
            const tutorials = getTutorials();
            tutorials.splice(index, 1);
            setTutorials(tutorials);
            renderTutorials();
            showToast('Tutorial deleted!', 'success');
        }

        // =============================================
        // ===== FORM: ADD UPDATE =====
        // =============================================
        document.getElementById('updateForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const date = document.getElementById('updateDate').value;
            const title = document.getElementById('updateTitle').value.trim();
            const changesText = document.getElementById('updateChanges').value.trim();

            if (!date || !title || !changesText) {
                showToast('Please fill all fields!', 'error');
                return;
            }

            const lines = changesText.split('\n').filter(line => line.trim() !== '');
            const changes = lines.map(line => {
                let type = 'add';
                let text = line.trim();
                if (text.startsWith('[+]')) { type = 'add'; text = text.replace('[+]', '').trim(); }
                else if (text.startsWith('[-]')) { type = 'fix'; text = text.replace('[-]', '').trim(); }
                else if (text.startsWith('[x]')) { type = 'remove'; text = text.replace('[x]', '').trim(); }
                else if (text.startsWith('[~]')) { type = 'change'; text = text.replace('[~]', '').trim(); }
                return { type, text };
            });

            if (changes.length === 0) {
                showToast('Please enter at least one valid change!', 'error');
                return;
            }

            const updates = getUpdates();
            updates.unshift({ date, title, changes });
            setUpdates(updates);

            renderUpdates();
            this.reset();
            document.getElementById('updateDate').value = new Date().toISOString().split('T')[0];
            showToast('Update added! ✅', 'success');
        });

        // =============================================
        // ===== FORM: ADD TUTORIAL =====
        // =============================================
        document.getElementById('tutorialForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('tutorialTitle').value.trim();
            const desc = document.getElementById('tutorialDesc').value.trim();
            const url = document.getElementById('tutorialUrl').value.trim();

            if (!title || !desc || !url) {
                showToast('Please fill all fields!', 'error');
                return;
            }

            const tutorials = getTutorials();
            tutorials.push({ title, desc, url });
            setTutorials(tutorials);

            renderTutorials();
            this.reset();
            showToast('Tutorial added! ✅', 'success');
        });

        // =============================================
        // ===== SET DEFAULT DATE =====
        // =============================================
        document.getElementById('updateDate').value = new Date().toISOString().split('T')[0];

        // =============================================
        // ===== INIT =====
        // =============================================
        renderUpdates();
        renderTutorials();

        console.log('🔐 Admin Panel Loaded!');
        console.log('📦 Data stored in localStorage');
        console.log('📢 Updates: ' + getUpdates().length);
        console.log('🎥 Tutorials: ' + getTutorials().length);
    </script>
</body>
</html>
